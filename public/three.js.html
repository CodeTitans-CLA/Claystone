<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1.0" name="viewport" />
  <link rel="preconnect" href="https://ajax.googleapis.com" crossorigin>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Tailwind er "fixed inset-0 w-full h-full bg-transparent" er plain CSS version */
    .animation-wrap {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: block;
    }
  </style>
</head>

<body>
  <!-- STITCH_THREEJS_START:ANIMATION_1 -->
  <div class="animation-wrap">
    <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
    <div id="threejs-container-ANIMATION_1" style="width:100%;height:100%"></div>
    <script>
      (function () {
        const container = document.getElementById('threejs-container-ANIMATION_1');
        const containerEl = container || document.body;

        // Architectural Isometric Grid + Web Development Cyber Structure Animation
        // Color accent: #13DE65

        // =====================================================================
        // >>> SETTINGS (ekhane value change korben) <<<
        // =====================================================================

        // --- Position (px) ---
        // X: positive = right e, negative = left e | Y: positive = niche, negative = upore
        const ANIMATION_OFFSET_X = 300;
        const ANIMATION_OFFSET_Y = 100;
        // Choto screen (phone) er jonno alada offset. Ekhon desktop er sathe same rakha hoyeche.
        // Phone e animation screen er baire chole gele ei duita value komiye dio (jemon 0).
        const ANIMATION_OFFSET_X_MOBILE = 300;
        const ANIMATION_OFFSET_Y_MOBILE = 100;
        const MOBILE_BREAKPOINT = 768;   // ei width er niche hole mobile offset use hobe

        // --- Koyta object thakbe (shob device e same, tomar ager code er moto) ---
        const BUILDINGS = 28;
        const PARTICLES = 120;
        const CONNECTORS = 45;

        // --- Quality / Performance ---
        const MAX_PIXEL_RATIO = 1.5;   // tomar ager code er moto. Komale halka hobe kintu ektu jhapsa dekhabe
        const TARGET_FPS = 60;         // 120Hz/144Hz screen e o eta er beshi render korbe na. 0 dile limit thakbe na
        const AUTO_QUALITY = false;    // true korle FPS kom hole nije theke sharpness kombe (look change hobe)

        // =====================================================================

        const numBuildings = BUILDINGS;
        const streamCount = PARTICLES;
        const connectorCount = CONNECTORS;

        const width = containerEl.clientWidth || window.innerWidth;
        const height = containerEl.clientHeight || window.innerHeight;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x070b09, 0.015);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(24, 20, 28);
        camera.lookAt(0, 2, 0);

        // Animation ke screen er moddhe shift korar function (screen size onujayi desktop/mobile offset nibe)
        function applyViewOffset(w, h) {
          const mobileNow = window.innerWidth < MOBILE_BREAKPOINT;
          const ox = mobileNow ? ANIMATION_OFFSET_X_MOBILE : ANIMATION_OFFSET_X;
          const oy = mobileNow ? ANIMATION_OFFSET_Y_MOBILE : ANIMATION_OFFSET_Y;
          camera.setViewOffset(w, h, -ox, -oy, w, h);
        }
        applyViewOffset(width, height);

        const renderer = new THREE.WebGLRenderer({
          alpha: true,
          antialias: true,
          powerPreference: "high-performance"
        });
        let currentRatio = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO);
        renderer.setPixelRatio(currentRatio);
        renderer.setSize(width, height);
        renderer.domElement.style.display = 'block';
        containerEl.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x13DE65, 2.5, 60);
        pointLight.position.set(10, 25, 15);
        scene.add(pointLight);

        const secondaryLight = new THREE.PointLight(0x00FF88, 1.8, 50);
        secondaryLight.position.set(-15, 10, -10);
        scene.add(secondaryLight);

        // Group holding entire architectural compound
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // Materials (shob building ei shared material gulo use kore)
        const wireMaterial = new THREE.LineBasicMaterial({
          color: 0x13DE65,
          transparent: true,
          opacity: 0.45,
          blending: THREE.AdditiveBlending
        });

        const glowingWireMaterial = new THREE.LineBasicMaterial({
          color: 0x4EFEB3,
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending
        });

        const darkGlassMaterial = new THREE.MeshPhongMaterial({
          color: 0x0a1610,
          emissive: 0x051f11,
          specular: 0x13DE65,
          shininess: 90,
          transparent: true,
          opacity: 0.65,
          flatShading: true
        });

        const solidAccentMaterial = new THREE.MeshPhongMaterial({
          color: 0x13DE65,
          emissive: 0x0d7d3b,
          shininess: 100,
          wireframe: false
        });

        // IMPORTANT: Instanced mesh (spire, tip, connector) er jonno alada material.
        // Ekoi material normal Mesh (innerCoreMesh) + InstancedMesh e share korle three.js r125 e
        // instanced object gulo screen e ashe na. Tai clone kore alada material dewa hoyeche (color ekoi).
        const solidAccentInstanced = solidAccentMaterial.clone();

        // Helper: vertex array theke ekta LineSegments toiri kore
        function makeLines(verts, material) {
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
          return new THREE.LineSegments(g, material);
        }

        // Helper: ekta floor er outline (y height e)
        function floorRing(w, d, y) {
          const x = w / 2, z = d / 2;
          return [-x, y, -z, x, y, -z, x, y, -z, x, y, z, x, y, z, -x, y, z, -x, y, z, -x, y, -z];
        }

        // 1. Base Blueprint Grid Plane (Architecture Grid)
        const gridHelper = new THREE.GridHelper(60, 40, 0x13DE65, 0x0f3821);
        gridHelper.position.y = -0.05;
        worldGroup.add(gridHelper);

        // 2. Procedural Architectural Building Blocks & Parametric Skyscrapers
        const buildings = [];
        const spires = [];

        for (let i = 0; i < numBuildings; i++) {
          const angle = (i / numBuildings) * Math.PI * 2;
          const radius = 5 + (i % 4) * 4.2;
          const posX = Math.cos(angle) * radius + (Math.sin(i * 3.5) * 2.5);
          const posZ = Math.sin(angle) * radius + (Math.cos(i * 2.1) * 2.5);

          const bWidth = 1.6 + (i % 3) * 0.9;
          const bDepth = 1.6 + ((i + 1) % 3) * 0.9;
          const bHeight = 4 + (i % 7) * 2.4;

          const buildingGroup = new THREE.Group();
          buildingGroup.position.set(posX, 0, posZ);

          // Solid Core (Glass monolith) - tomar original code er moto-i
          const geom = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
          const mesh = new THREE.Mesh(geom, darkGlassMaterial);
          mesh.position.y = bHeight / 2;
          buildingGroup.add(mesh);

          // Edges / Architectural Blueprint Wireframe - tomar original code er moto-i
          const edges = new THREE.EdgesGeometry(geom);
          const wire = new THREE.LineSegments(edges, (i % 3 === 0) ? glowingWireMaterial : wireMaterial);
          wire.position.y = bHeight / 2;
          buildingGroup.add(wire);

          // Floor lines: ager moto 5-10 ta alada line object na, ekta building e 1 ta merged object (look ekoi)
          const floorVerts = [];
          const floorLevels = Math.floor(bHeight / 1.2);
          for (let f = 1; f < floorLevels; f++) {
            const ring = floorRing(bWidth, bDepth, f * 1.2);
            for (let r = 0; r < ring.length; r++) floorVerts.push(ring[r]);
          }
          buildingGroup.add(makeLines(floorVerts, wireMaterial));

          worldGroup.add(buildingGroup);

          const item = {
            group: buildingGroup,
            baseHeight: bHeight,
            speed: 0.8 + (i % 5) * 0.4,
            offset: i * 0.7,
            scale: 1
          };
          buildings.push(item);

          // Roof Spire or Web Server Beacon (pore instanced mesh e ekshathe draw hobe)
          if (i % 2 === 0) {
            spires.push({
              building: item,
              x: posX,
              z: posZ,
              baseH: bHeight,
              h: 2.5 + (i % 3) * 1.5
            });
          }
        }

        // Spire + Glowing tip: shob spire ekta draw call e, shob tip ekta draw call e
        const dummy = new THREE.Object3D();

        const spireInstances = new THREE.InstancedMesh(
          new THREE.CylinderGeometry(0.04, 0.1, 1, 6), // height 1, pore scale diye height dewa hoy
          solidAccentInstanced,
          spires.length
        );
        const tipInstances = new THREE.InstancedMesh(
          new THREE.SphereGeometry(0.18, 8, 8),
          solidAccentInstanced,
          spires.length
        );
        spireInstances.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        tipInstances.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        spireInstances.frustumCulled = false;
        tipInstances.frustumCulled = false;
        worldGroup.add(spireInstances);
        worldGroup.add(tipInstances);

        function updateSpires() {
          for (let k = 0; k < spires.length; k++) {
            const sp = spires[k];
            const s = sp.building.scale; // building er breathing scale-er sathe milie

            dummy.position.set(sp.x, s * (sp.baseH + sp.h / 2), sp.z);
            dummy.scale.set(1, s * sp.h, 1);
            dummy.updateMatrix();
            spireInstances.setMatrixAt(k, dummy.matrix);

            dummy.position.set(sp.x, s * (sp.baseH + sp.h), sp.z);
            dummy.scale.set(1, s, 1);
            dummy.updateMatrix();
            tipInstances.setMatrixAt(k, dummy.matrix);
          }
          spireInstances.instanceMatrix.needsUpdate = true;
          tipInstances.instanceMatrix.needsUpdate = true;
        }

        // 3. Central Web-Dev + Architecture Synthesis Hub (Polyhedral Core / Digital Spire)
        const coreGroup = new THREE.Group();
        coreGroup.position.set(0, 5.5, 0);

        const polyGeom = new THREE.IcosahedronGeometry(2.8, 1);
        const polyEdges = new THREE.EdgesGeometry(polyGeom);
        const centralWire = new THREE.LineSegments(polyEdges, glowingWireMaterial);
        coreGroup.add(centralWire);

        const innerCoreGeom = new THREE.OctahedronGeometry(1.6, 0);
        const innerCoreMesh = new THREE.Mesh(innerCoreGeom, solidAccentMaterial);
        coreGroup.add(innerCoreMesh);

        // Digital Orbit Rings (Web development network orbits)
        const ringGeom1 = new THREE.RingGeometry(4.6, 4.75, 64);
        const ringWire1 = new THREE.LineLoop(ringGeom1, wireMaterial);
        ringWire1.rotation.x = Math.PI / 2.3;
        coreGroup.add(ringWire1);

        const ringGeom2 = new THREE.RingGeometry(6.2, 6.35, 64);
        const ringWire2 = new THREE.LineLoop(ringGeom2, glowingWireMaterial);
        ringWire2.rotation.x = -Math.PI / 3;
        ringWire2.rotation.y = Math.PI / 4;
        coreGroup.add(ringWire2);

        worldGroup.add(coreGroup);

        // 4. Data Streams / Laser Elevation Beams (Architecture Elevation Lines & Data Packets)
        const streamGeometry = new THREE.BufferGeometry();
        const streamPositions = new Float32Array(streamCount * 3);
        const streamSpeeds = new Float32Array(streamCount);

        for (let k = 0; k < streamCount; k++) {
          streamPositions[k * 3] = (Math.random() - 0.5) * 44;
          streamPositions[k * 3 + 1] = Math.random() * 26;
          streamPositions[k * 3 + 2] = (Math.random() - 0.5) * 44;
          streamSpeeds[k] = 0.04 + Math.random() * 0.09;
        }

        streamGeometry.setAttribute('position', new THREE.BufferAttribute(streamPositions, 3));
        const streamMaterial = new THREE.PointsMaterial({
          color: 0x13DE65,
          size: 0.35,
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending
        });
        const streamParticles = new THREE.Points(streamGeometry, streamMaterial);
        worldGroup.add(streamParticles);

        // 5. Digital Web Code Nodes / Architectural Truss Connectors (shob cube ekta draw call e)
        const connectorInstances = new THREE.InstancedMesh(
          new THREE.BoxGeometry(0.25, 0.25, 0.25),
          solidAccentInstanced,
          connectorCount
        );
        dummy.scale.set(1, 1, 1);
        for (let c = 0; c < connectorCount; c++) {
          dummy.position.set(
            (Math.random() - 0.5) * 36,
            2 + Math.random() * 16,
            (Math.random() - 0.5) * 36
          );
          dummy.updateMatrix();
          connectorInstances.setMatrixAt(c, dummy.matrix);
        }
        connectorInstances.frustumCulled = false;
        worldGroup.add(connectorInstances);

        // Mouse Interactivity
        let mouseX = 0;
        let mouseY = 0;
        let targetCameraX = 24;
        let targetCameraY = 20;

        function onMouseMove(event) {
          const normX = (event.clientX / window.innerWidth) * 2 - 1;
          const normY = -(event.clientY / window.innerHeight) * 2 + 1;
          mouseX = normX * 12;
          mouseY = normY * 8;
        }
        window.addEventListener('mousemove', onMouseMove, { passive: true });

        // Size / offset / pixel ratio ekshathe apply kore
        function applyRenderSize() {
          const w = containerEl.clientWidth || window.innerWidth;
          const h = containerEl.clientHeight || window.innerHeight;
          camera.aspect = w / h;
          applyViewOffset(w, h); // resize hole-o offset thik thakbe
          renderer.setPixelRatio(currentRatio);
          renderer.setSize(w, h);
          renderer.render(scene, camera); // setSize canvas clear kore, tai pause thakleo ekbar draw kore dao
        }

        // Resize: user drag korar somoy bar bar na chalie, thamle ekbar chalabe
        let resizeTimer = null;
        window.addEventListener('resize', function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(applyRenderSize, 100);
        });

        // Auto quality: FPS kom hole pixel ratio kombabe
        let qFrames = 0, qTime = 0;
        function autoQuality(dt, t) {
          if (!AUTO_QUALITY || currentRatio <= 1 || t < 2) return; // shuru r 2 second shader compile er jonno skip
          qFrames++;
          qTime += dt;
          if (qTime >= 1.5) {
            const fps = qFrames / qTime;
            qFrames = 0;
            qTime = 0;
            if (fps < 40) {
              currentRatio = Math.max(1, currentRatio - 0.25);
              applyRenderSize();
            }
          }
        }

        // Animation Loop
        const clock = new THREE.Clock();
        const FRAME_INTERVAL = TARGET_FPS > 0 ? 1 / TARGET_FPS : 0;
        let t = 0;
        let timeSinceRender = 0;
        let rafId = null;
        let isInView = true;
        let isTabVisible = !document.hidden;
        let parentVisible = true;   // parent page (Next.js) bole hero section screen e ache kina
        let isScrolling = false;    // parent page ekhon scroll hocche kina

        function animate() {
          rafId = requestAnimationFrame(animate);

          // FPS cap
          timeSinceRender += clock.getDelta();
          if (timeSinceRender < FRAME_INTERVAL * 0.8) return;
          const dt = Math.min(timeSinceRender, 0.1); // lag/pause er por lafie na jay
          timeSinceRender = 0;
          t += dt;

          // Subtle world rotation mimicking CAD view orbit
          worldGroup.rotation.y = t * 0.08;

          // Inner synth core rotation
          coreGroup.rotation.x = t * 0.25;
          coreGroup.rotation.y = t * 0.35;
          innerCoreMesh.rotation.y = -t * 0.7;
          innerCoreMesh.rotation.z = t * 0.5;

          // Floating oscillation of central core
          coreGroup.position.y = 5.5 + Math.sin(t * 1.5) * 0.8;

          // Parametric breathing of architectural blocks
          for (let b = 0; b < buildings.length; b++) {
            const item = buildings[b];
            item.scale = 1 + Math.sin(t * item.speed + item.offset) * 0.12;
            item.group.scale.set(1, item.scale, 1);
          }
          updateSpires();

          // Floating data stream / ascending packets (speed ekhon time-based, 60fps e ager moto-i)
          const posArr = streamGeometry.attributes.position.array;
          const speedFactor = 60 * dt;
          for (let p = 0; p < streamCount; p++) {
            posArr[p * 3 + 1] += streamSpeeds[p] * speedFactor;
            if (posArr[p * 3 + 1] > 26) {
              posArr[p * 3 + 1] = 0;
            }
          }
          streamGeometry.attributes.position.needsUpdate = true;

          // Pulse point lights
          pointLight.intensity = 2.0 + Math.sin(t * 2.5) * 0.8;
          pointLight.position.x = Math.sin(t * 0.5) * 16;
          pointLight.position.z = Math.cos(t * 0.5) * 16;

          // Camera damping with mouse
          const damp = 1 - Math.pow(1 - 0.04, dt * 60);
          targetCameraX = 24 + mouseX;
          targetCameraY = Math.max(8, 20 + mouseY);
          camera.position.x += (targetCameraX - camera.position.x) * damp;
          camera.position.y += (targetCameraY - camera.position.y) * damp;
          camera.lookAt(0, 3.5, 0);

          renderer.render(scene, camera);
          autoQuality(dt, t);
        }

        // Tab hidden / animation screen er baire / page scroll hocche - ei shob somoy render bondho (battery + performance)
        function updateRunning() {
          const shouldRun = isInView && isTabVisible && parentVisible && !isScrolling;
          if (shouldRun && rafId === null) {
            clock.getDelta();      // pause er somoyer delta bad dao
            timeSinceRender = 0;
            rafId = requestAnimationFrame(animate);
          } else if (!shouldRun && rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
        }

        document.addEventListener('visibilitychange', function () {
          isTabVisible = !document.hidden;
          updateRunning();
        });

        // Parent page (Hero3DScene.tsx) theke pause/resume signal: { source: 'hero-3d-scene', visible, scrolling }
        window.addEventListener('message', function (e) {
          if (e.origin !== window.location.origin) return;
          const d = e.data;
          if (!d || d.source !== 'hero-3d-scene') return;
          if (typeof d.visible === 'boolean') parentVisible = d.visible;
          if (typeof d.scrolling === 'boolean') isScrolling = d.scrolling;
          updateRunning();
        });

        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (entries) {
            isInView = entries[0].isIntersecting;
            updateRunning();
          }).observe(containerEl);
        }

        updateRunning();

      })();
    </script>
  </div>
  <!-- STITCH_THREEJS_END:ANIMATION_1 -->
</body>

</html>
